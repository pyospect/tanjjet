name: Tanjjet
options:
  bundleIdPrefix: com.pyospect
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Tanjjet:
    type: application
    platform: iOS
    sources:
      - path: Tanjjet
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pyospect.tanjjet
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_CFBundleDisplayName: "딴젯"
        CODE_SIGN_ENTITLEMENTS: Tanjjet/Tanjjet.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - package: Supabase
      - target: TanjjetWidgetExtension

  TanjjetWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TanjjetWidget
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
    info:
      path: TanjjetWidget/Info.plist
      properties:
        CFBundleDisplayName: "딴젯 위젯"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pyospect.tanjjet.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: TanjjetWidget/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "6"
        CODE_SIGN_ENTITLEMENTS: TanjjetWidget/TanjjetWidgetExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  TanjjetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TanjjetTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pyospect.tanjjet.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tanjjet

schemes:
  Tanjjet:
    build:
      targets:
        Tanjjet: all
        TanjjetWidgetExtension: all
        TanjjetTests: [test]
    test:
      config: Debug
      targets:
        - TanjjetTests
    run:
      config: Debug
    archive:
      config: Release
